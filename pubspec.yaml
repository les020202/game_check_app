name: game_check_app
description: "A new Flutter project."

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  provider: ^6.1.5+1
  dotted_border: ^3.1.0
  table_calendar: ^3.2.1
  intl: ^0.20.3
  uuid: ^4.6.0
  drift: ^2.35.0
  sqlite3: ^3.5.2
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.5
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_storage: ^13.6.0
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  drift_dev: ^2.35.0
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0


flutter:
  assets:
    - assets/
    - assets/presets/

  uses-material-design: true

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard/Pretendard-Thin.ttf
          weight: 100
        - asset: assets/fonts/Pretendard/Pretendard-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Pretendard/Pretendard-Light.ttf
          weight: 300
        - asset: assets/fonts/Pretendard/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/Pretendard/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/fonts/Pretendard/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard/Pretendard-Bold.ttf
          weight: 700
        - asset: assets/fonts/Pretendard/Pretendard-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Pretendard/Pretendard-Black.ttf
          weight: 900
